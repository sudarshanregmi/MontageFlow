[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "montageflow"
version = "0.1.0"
description = "Physically valid, high-fidelity EEG generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy>=1.24,<2", "scipy>=1.10", "scikit-learn>=1.3", "pyyaml>=6.0", "safetensors>=0.4",
                "huggingface_hub>=0.23"]

[tool.setuptools.packages.find]
include = ["montageflow*"]
